<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>highpal // notes</title>
    <style>
        body {
            background-color: #ffffff;
            color: #000000;
            font-family: "Comic Sans MS", "Times New Roman", Arial, sans-serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: #ffffff;
            padding: 25px;
            border: 2px solid #000000;
        }

        h1 {
            font-size: 1.3rem;
            color: #0000ff;
            text-decoration: underline;
            margin-bottom: 20px;
            font-weight: normal;
        }

        p.note-body {
            font-size: 1rem;
            line-height: 1.5;
            color: #000000;
            margin-bottom: 15px;
        }

        /* Скрытое окно ввода */
        .secret-input-wrapper {
            margin-top: 40px;
            padding-top: 10px;
        }

        .secret-input {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 1px solid #eeeeee;
            color: #333333;
            font-family: inherit;
            font-size: 0.85rem;
            outline: none;
            padding: 4px 0;
            opacity: 0.1;
            transition: opacity 0.2s;
        }

        .secret-input:focus, .secret-input:hover {
            opacity: 0.8;
            border-bottom: 1px solid #999999;
        }

        .result-box {
            display: none;
            margin-top: 25px;
            padding: 15px;
            background: #fffafa;
            border: 1px dashed #ff0000;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .chat-block {
            background: #f4f4f4;
            border: 1px solid #cccccc;
            padding: 10px;
            margin: 10px 0;
            font-size: 0.9rem;
            font-family: Arial, sans-serif;
        }

        .msg {
            margin-bottom: 5px;
        }
        .msg:last-child { margin-bottom: 0; }
        .msg .author { color: #cc0000; font-weight: bold; }

        .red-alert {
            color: #ff0000;
            font-weight: bold;
        }

        .arg-img-link {
            display: inline-block;
            margin-top: 12px;
            max-width: 100%;
        }

        .arg-img {
            max-width: 100%;
            height: auto;
            border: 1px solid #000000;
            display: block;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>highpal's personal notes page</h1>

    <p class="note-body">
        все окна открыты на распашку, но все так же воняет, это ужасно
    </p>

    <p class="note-body">
        не могу перестать играть в майн. мне там спокойней.
    </p>

    <div id="resultBox" class="result-box"></div>

    <!-- Скрытая строка ввода -->
    <div class="secret-input-wrapper">
        <input type="text" id="searchInput" class="secret-input" autocomplete="off">
    </div>
</div>

<script>
    const input = document.getElementById('searchInput');
    const result = document.getElementById('resultBox');

    // Счетчик повторных вводов
    const entryCounts = {};

    // Функция автозамены расширений с обновлением ссылки
    function imgError(img) {
        let newSrc = img.src;
        if (img.src.endsWith('.jpg')) {
            newSrc = img.src.replace('.jpg', '.png');
        } else if (img.src.endsWith('.png')) {
            newSrc = img.src.replace('.png', '.jpeg');
        } else if (img.src.endsWith('.jpeg')) {
            newSrc = img.src.replace('.jpeg', '.JPG');
        } else {
            img.onerror = null;
            return;
        }
        img.src = newSrc;
        if (img.parentElement && img.parentElement.tagName === 'A') {
            img.parentElement.href = newSrc;
        }
    }

    // Авто-фокус при печати
    document.addEventListener('keydown', function(e) {
        if (document.activeElement !== input && e.key.length === 1) {
            input.focus();
        }
    });

    // Обработка Enter
    input.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            e.preventDefault();

            const query = input.value.trim().toLowerCase();
            input.value = '';

            if (!query) return;

            entryCounts[query] = (entryCounts[query] || 0) + 1;
            const step = entryCounts[query];

            result.style.display = 'block';

            if (query === 'michael' || query === 'майкл') {
                if (step < 6) {
                    result.innerHTML = `
                        <span class="red-alert">[ ПРИДУРОК ]</span><br><br>
                        Он кричал, требовал ответов и угрожал вызвать полицию.<br><br>
                        он меня сильно обидел, почему он так общался со мной? <br>
                        <span class="red-alert">Теперь у меня нет друзей.</span>
                    `;
                } else if (step === 6) {
                    result.innerHTML = `
                        <span class="red-alert">[ ПРИДУРОК ]</span><br><br>
                        мы же раньше нормально общались. <br>
                        <a href="friends.jpg" target="_blank" rel="noopener noreferrer" class="arg-img-link">
                            <img src="friends.jpg" onerror="imgError(this)" class="arg-img" alt="старое фото">
                        </a>
                    `;
                } else {
                    result.innerHTML = `
                        <span class="red-alert">[ ПРИДУРОК ]</span><br><br>
                        ОН ЖУТКО ПАХНЕТ НЕНАВИЖУ ТО ЧТО ОН СУЕТ СВОЙ ДРАННЫЙ НОС КУДА НЕ НАДО ОСЕЛ ОСЕЛ ОСЕЛ ОСЕЛ ОСЕЛ ОСЕЛ<br>
                        <a href="crime.jpg" target="_blank" rel="noopener noreferrer" class="arg-img-link">
                            <img src="crime.jpg" onerror="imgError(this)" class="arg-img" alt="коридор">
                        </a>
                    `;
                }
            } else if (query === 'kvass' || query === 'квасс') {
                if (step < 6) {
                    result.innerHTML = `
                        <span class="red-alert">[НЯШ]</span><br><br>
                        наконец нашла мод в который мы с ней сможем сыграть. .<br><br>
                        мне так жаль. <br>
                        <em>Она все еще в той комнате.</em>
                    `;
                } else if (step === 6) {
                    result.innerHTML = `
                        <span class="red-alert">[...]</span><br><br>
                        она всегда помогала в трудных ситуациях.<br>
                        <a href="gift.jpg" target="_blank" rel="noopener noreferrer" class="arg-img-link">
                            <img src="gift.jpg" onerror="imgError(this)" class="arg-img" alt="подарок">
                        </a>
                    `;
                } else {
                    result.innerHTML = `
                        <span class="red-alert">[...]</span><br><br>
                        "перестань ворошить прошлое.живи настоящим. это же не конец" <br>
                        <a href="gift.jpg" target="_blank" rel="noopener noreferrer" class="arg-img-link">
                            <img src="gift.jpg" onerror="imgError(this)" class="arg-img" alt="подарок">
                        </a>
                    `;
                }
            } else if (query === '2606' || query === '26.06' || query === '26062026') {
                if (step === 1) {
                    result.innerHTML = `
                        <span class="red-alert">[26.06.2026 — НОЧЬ]</span><br><br>
                        Я думала, она притворяется.<br><br>
                        <em> майкл скинул мне эти сообщения. что он хотел этим сказать? ненавижу его. (02:41):</em>
                        <div class="chat-block">
                            <div class="msg"><span class="author">Квасс:</span> Майкл, мне пиздец плохо. хайпал сует мне какую-то хрень, говорит, что это весело </div>
                            <div class="msg"><span class="author">Квасс:</span> она смеется и говорит что я придумываю..</div>
                            <div class="msg"><span class="author">Квасс:</span> я не могу встать</div>
                        </div>
                        <span class="red-alert">почему она пишет это ЕМУ? .</span>
                    `;
                } else {
                    result.innerHTML = `
                        <span class="red-alert">[26.06.2026]</span><br><br>
                        0-0 <br>
                    `;
                }
            } else if (query === 'highpal') {
                result.innerHTML = `
                    <span class="red-alert">[ НАПОМИНАНИЕ]</span><br><br>
                    следщ мод играем вместе в ...??? еще думаю. <br>
                    ну окей. в процессе разберусь
                `;
            } else if (query === 'подарок' || query === 'gift' || query === 'свинка') {
                result.innerHTML = `
                    <span class="red-alert">[ ЕЕ ПОДАРОК ]</span><br><br>
                    годный подарок на др! <br>
                    спс <br>
                    <a href="gift.jpg" target="_blank" rel="noopener noreferrer" class="arg-img-link">
                        <img src="gift.jpg" onerror="imgError(this)" class="arg-img" alt="подарок">
                    </a>
                `;
            } else {
                result.innerHTML = `<span style="color: #666666;">Запись по запросу "${query}" не найдена или была уничтожена.</span>`;
            }
        }
    });
</script>

</body>
</html>
