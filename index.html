<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>highpal // notes</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;600&display=swap');

        :root {
            --bg-main: #070709;
            --bg-card: #0e0e13;
            --border-color: #1a1a24;
            --text-main: #d1d1e0;
            --text-muted: #525266;
            --accent-red: #ff2a4b;
            --accent-glow: rgba(255, 42, 75, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: 'Fira Code', monospace;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        /* Фоновый шумок и мягкая виньетка */
        body::after {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 40%, #000000 100%);
            pointer-events: none;
            z-index: 1;
        }

        .workspace {
            width: 100%;
            max-width: 780px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8), 0 0 20px var(--accent-glow);
            overflow: hidden;
            position: relative;
            z-index: 2;
        }

        .top-bar {
            background: #09090d;
            padding: 12px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .status-dots {
            display: flex;
            gap: 6px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #222230;
        }

        .dot.active {
            background: var(--accent-red);
            box-shadow: 0 0 8px var(--accent-red);
        }

        .content {
            padding: 30px;
        }

        .note-title {
            color: #fff;
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .note-title::before {
            content: "//";
            color: var(--accent-red);
        }

        p.note-body {
            font-size: 0.9rem;
            line-height: 1.7;
            color: var(--text-main);
            margin-bottom: 15px;
            border-left: 2px solid var(--border-color);
            padding-left: 15px;
        }

        .search-wrapper {
            margin-top: 30px;
            position: relative;
        }

        .search-input {
            width: 100%;
            background: #050507;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 14px 16px;
            color: #fff;
            font-family: inherit;
            font-size: 0.9rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-input:focus {
            border-color: var(--accent-red);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .result-box {
            display: none;
            margin-top: 20px;
            padding: 20px;
            background: #050507;
            border: 1px solid var(--accent-red);
            border-radius: 4px;
            font-size: 0.85rem;
            line-height: 1.6;
            animation: fadeIn 0.3s ease;
        }

        .chat-block {
            background: #0a0a0f;
            border: 1px solid #1c1c28;
            padding: 12px;
            border-radius: 4px;
            margin: 10px 0;
            font-size: 0.8rem;
        }

        .msg {
            margin-bottom: 6px;
        }
        .msg:last-child { margin-bottom: 0; }
        .msg .author { color: var(--accent-red); font-weight: 600; }
        .msg .author.m { color: #5a88ff; }

        .red-alert {
            color: var(--accent-red);
            font-weight: 600;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="workspace">
    <div class="top-bar">
        <div class="status-dots">
            <div class="dot active"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
        <div>HIGHPAL_MEMO_V2.1</div>
    </div>

    <div class="content">
        <div class="note-title">записи_для_себя.txt</div>
        
        <p class="note-body"> 
          все окна открыты на распашку, но все так же воняет, это ужасно
        </p>

        <p class="note-body">
            не могу перестать играть в майн. мне там спокойней.
        </p>

        <div class="search-wrapper">
            <input type="text" id="searchInput" class="search-input" placeholder="поиск по архивным тегам (ключевые слова / даты)..." autofocus>
        </div>

        <div id="resultBox" class="result-box"></div>
    </div>
</div>

<script>
    const input = document.getElementById('searchInput');
    const result = document.getElementById('resultBox');

    input.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            const query = input.value.trim().toLowerCase();
            input.value = '';

            if (query === '2606' || query === '26.06' || query === '26062026') {
                result.style.display = 'block';
                result.innerHTML = `
                    <span class="red-alert">[26.06.2026 — НОЧЬ]</span><br><br>
                     Я думала, она притворяется.<br><br>
                    <em> майкл скинул мне эти сообщения. что он хотел этим сказать? ненавижу его. (02:41):</em>
                    <div class="chat-block">
                        <div class="msg"><span class="author">Квасс:</span> Майкл, мне пиздец плохо. хайпал сует мне какую-то хрень, говорит, что это весело </div>
                        <div class="msg"><span class="author">Квасс:</span> она смеется и говорит что я придумываю..</div>
                        <div class="msg"><span class="author">Квасс:</span> я не могу встать</div>
                    </div>
                    <span class="red-alert">почему она пишет это ЕМУ? .</span>
                `;
            } else if (query === 'kvass' || query === 'квасс') {
                result.style.display = 'block';
                result.innerHTML = `
                    <span class="red-alert">[НЯШ]</span><br><br>
                    наконец нашла мод в который мы с ней сможем сыграть. .<br><br>
                    мне так жаль. <br>
                    <em>Она все еще в той комнате.</em>
                `;
            } else if (query === 'michael' || query === 'майкл') {
                result.style.display = 'block';
                result.innerHTML = `
                    <span class="red-alert">[ ПРИДУРОК ]</span><br><br>
                    Он кричал, требовал ответов и угрожал вызвать полицию.<br><br>
                    он меня сильно обидел, почему он так общался со мной? <br>
                    <span class="red-alert">Теперь у меня нет друзей. </span>
                `;
            } else if (query === 'highpal') {
                result.style.display = 'block';
                result.innerHTML = `
                    <span class="red-alert">[ НАПОМИНАНИЕ]</span><br><br>
                    следщ мод играем вместе в ...??? еще думаю. <br>
                    ну окей. в процессе разберусь
                `;
            } else {
                result.style.display = 'block';
                result.innerHTML = `<span style="color: var(--text-muted);">Запись по запросу "${query}" не найдена или была уничтожена.</span>`;
            }
        }
    });
</script>

</body>
</html>
